name = "movies-stream"
main = "cloudflare/stream-worker/src/worker.js"
compatibility_date = "2024-11-01"

# Optional secret: npx wrangler secret put STREAM_WORKER_SECRET
[vars]
ALLOW_ORIGIN = "*"
PAGE_TIMEOUT_MS = "8000"
# Used only when xvideos does not return a player script to the Worker.
# Set the key with: npx wrangler secret put AWS_API_KEY
AWS_API_BASE_URL = "https://api.mhd-api.xyz"
